name: Sync upstream and phone-web

on:
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'loyux/thinkrail' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Configure synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/JetBrains/thinkrail.git
      - name: Merge upstream into main and phone-web
        run: bash .github/scripts/sync-upstream.sh
